<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>ショート動画 離脱UI(色彩低減)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="feed"></div>

  <div class="tabs"><span>フォロー中</span><span class="on">おすすめ</span></div>

  <nav class="nav">
    <div class="on"><svg viewBox="0 0 24 24"><path d="M12 2.8L3 10.3V21a1 1 0 001 1h6v-7.5h4V22h6a1 1 0 001-1V10.3L12 2.8z"/></svg>ホーム</div>
    <div><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 015.9 12.1l5.3 5.3-1.4 1.4-5.3-5.3A7.5 7.5 0 1110.5 3zm0 2a5.5 5.5 0 100 11 5.5 5.5 0 000-11z"/></svg>検索</div>
    <div><span class="plus">+</span></div>
    <div><svg viewBox="0 0 24 24"><path d="M3 5h18a1 1 0 011 1v12a1 1 0 01-1 1H3a1 1 0 01-1-1V6a1 1 0 011-1zm1 2.4V16h16V7.4l-8 5.6-8-5.6z"/></svg>受信箱</div>
    <div><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4.4 0-8 2.2-8 5v3h16v-3c0-2.8-3.6-5-8-5z"/></svg>プロフィール</div>
  </nav>

  <!-- 研究者用の確認表示(?debug=1 のときだけ表示) -->
  <div id="hud" hidden>
    <div>経過 <b id="hTime">00:00</b></div>
    <div>彩度 <b id="hSat">100%</b></div>
    <div>視聴 <b id="hVids">1本</b></div>
    <div>版 <b id="hVer">-</b></div>
    <div class="btns">
      <button id="bSkip">+10秒</button>
      <button id="bReset">最初から</button>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
